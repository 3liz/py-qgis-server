name: 🚀 Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    name: "🚀 Release"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:

    - name: Set env
      # CI_COMMIT_TAG is used in Makefile to not have the "RC" flag
      run: echo "CI_COMMIT_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

    - name: Get source code
      uses: actions/checkout@v7

    - name: Changelog
      id: changelog
      uses: 3liz/changelog-release@0.4.0

    - name: Set up Python 3.13
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.13'

    - name: Fetch yapt
      run: |
        curl ${{ vars.YAPT_REPOSITORY_URL }} | tar -xzf -

    - name : Get current changelog
      run: |
        ./yapt-pkg changelog >> release.md
        cat release.md        

    - name: Build package
      run: |
        make configure
        make manifest dist

    - name: Create release on GitHub
      uses: ncipollo/release-action@v1.21.0
      with:
        body: ${{ steps.changelog.outputs.markdown }}
        token: ${{ secrets.BOT_HUB_TOKEN }}
        allowUpdates: true
        artifacts: "dist/*.tar.gz"

    - name: Deploy to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
